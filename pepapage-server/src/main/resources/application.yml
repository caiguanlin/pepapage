server:
  port: 8080

spring:
  application:
    name: pepapage-server
  profiles:
    active: local
  # 本机私密配置（数据库密码、OSS 密钥等）放在 application-local.yml，已加入 .gitignore
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pepapage?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  jackson:
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

pepapage:
  jwt:
    # 生产环境必须通过环境变量 JWT_SECRET 覆盖，长度至少 32 字节
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32bytes!!}
    ttl-hours: 168
  worker:
    # Python worker 回调本服务时携带的共享密钥
    token: ${WORKER_TOKEN:dev-worker-token}
    task-stream: pepapage:tasks
  oss:
    endpoint: ${OSS_ENDPOINT:}
    bucket: ${OSS_BUCKET:}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    # 上传签名有效期（秒）、单文件上限（MB）、下载签名 URL 有效期（秒）
    upload-expire-seconds: 900
    max-upload-mb: 50
    download-expire-seconds: 3600
