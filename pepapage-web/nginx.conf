# PepaPage 前端：静态站点 + 反向代理（容器内监听 8080）
# 依赖 compose 网络中名为 server 的后端服务（pepapage-server:8080）
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 与后端 multipart 上限（50MB）保持一致（课件导入）
    client_max_body_size 50m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    # 容器健康检查（HEALTHCHECK 使用，不进访问日志）
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # 后端 API：服务端 controller 自带 /api 前缀，路径原样透传、不做重写。
    # 前端全部用相对路径 /api/...，保证同源，后端无需 CORS。
    # 用变量写法 + Docker 内嵌 DNS：启动/nginx -t 时不解析 server 主机名，
    # 后端容器不在线也能通过配置检查（CI: docker run --entrypoint nginx IMAGE -t）。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://server:8080;

    location = /api {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # worker 内部回调接口，绝不对外暴露
    location = /internal {
        return 404;
    }
    location /internal/ {
        return 404;
    }

    # Vite 哈希文件名静态资源：永久缓存
    location /assets/ {
        access_log off;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA history 路由：未知路径回 index.html；入口文档不缓存
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
